apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo-web
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-web
  labels: { app.kubernetes.io/name: tempo-web, app.kubernetes.io/part-of: tempo }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: tempo-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo-web, app.kubernetes.io/part-of: tempo }
    spec:
      serviceAccountName: tempo-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: tempo-web }
      containers:
        - name: web
          image: tempo-web
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: tempo-web }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            # nginx renders its config here at start and writes pid/temp files to /tmp.
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          emptyDir: { sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-web
data:
  # Origin of the API gateway, added to the CSP connect-src. Set per environment.
  CSP_EXTRA_CONNECT_SRC: ""
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-web
  labels: { app.kubernetes.io/name: tempo-web }
spec:
  selector: { app.kubernetes.io/name: tempo-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tempo-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: tempo-web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tempo-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tempo-web }
